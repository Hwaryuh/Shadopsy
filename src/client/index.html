<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHADOPSY</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
</head>
<body class="bg-surface text-on-surface">

    <!-- TopAppBar -->
    <nav class="fixed top-0 left-0 right-0 h-14 z-50 flex items-center justify-between px-5 bg-surface/80 backdrop-blur-md border-b border-outline-variant/50">
        <div class="flex items-center gap-6 min-w-0">
            <a href="#" class="flex items-center gap-2.5 shrink-0 select-none">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" class="text-primary">
                    <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 0v4.5M10 15.5V20M0 10h4.5M15.5 10H20" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="10" cy="10" r="1.75" fill="currentColor"/>
                </svg>
                <span class="text-base font-bold tracking-[0.18em] font-headline">SHADOPSY</span>
            </a>

            <div id="version-selector" class="flex items-center gap-2 shrink-0">
                <select id="select-a" class="version-select"></select>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" class="text-on-surface-variant/60 shrink-0">
                    <path d="M2 7h9M8 3.5 11.5 7 8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <select id="select-b" class="version-select"></select>
                <button id="compare-btn" disabled
                    class="px-4 py-[5px] rounded-[6px] bg-primary text-on-primary font-mono text-control font-semibold tracking-[0.1em] uppercase cursor-pointer hover:bg-primary-dim shadow-sm">
                    Compare
                </button>
            </div>

            <div id="filters" class="hidden items-center gap-1.5 min-w-0 overflow-x-auto [scrollbar-width:none]">
                <button class="chip filter-btn" data-state="edited"><span class="chip-dot text-state-edited"></span>EDITED</button>
                <button class="chip filter-btn" data-state="added"><span class="chip-dot text-state-added"></span>ADDED</button>
                <button class="chip filter-btn" data-state="renamed"><span class="chip-dot text-state-renamed"></span>RENAMED</button>
                <button class="chip filter-btn" data-state="removed"><span class="chip-dot text-state-removed"></span>REMOVED</button>
                <div id="status" class="pl-2 text-on-surface-variant font-mono text-badge tracking-[0.12em] tabular-nums whitespace-nowrap"></div>
            </div>
        </div>

        <div class="flex items-center gap-3 shrink-0">
            <div class="flex items-center gap-1.5 pl-1.5 pr-1 py-1 rounded-[8px] bg-surface-container border border-transparent focus-within:border-primary/50 transition-colors">
                <div class="seg-group !bg-surface-container-high">
                    <button class="seg-btn search-scope-btn active" data-scope="path">Path</button>
                    <button class="seg-btn search-scope-btn" data-scope="content">Code</button>
                </div>
                <input id="search-input" type="text" disabled placeholder="Compare first…"
                    class="w-44 px-1.5 bg-transparent font-mono text-control text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none disabled:cursor-not-allowed" />
            </div>
        </div>
    </nav>

    <!-- SideNavBar -->
    <aside id="sidebar" class="fixed left-0 top-14 bottom-0 w-64 z-40 bg-surface-container-low/60 border-r border-outline-variant/50 flex flex-col overflow-y-auto">
        <div class="flex items-center justify-between px-3 pt-3 pb-2 sticky top-0 bg-surface-container-low/80 backdrop-blur-sm z-10">
            <span class="font-mono text-badge tracking-[0.16em] text-on-surface-variant/70 uppercase">Files</span>
            <div class="seg-group">
                <button class="seg-btn sort-btn active" data-sort="alpha">A–Z</button>
                <button class="seg-btn sort-btn" data-sort="ext">Ext</button>
                <button class="seg-btn sort-btn" data-sort="state">State</button>
            </div>
        </div>
        <div id="file-tree" class="flex flex-col pb-6 px-2"></div>
        <div id="sidebar-handle" class="absolute right-0 top-0 bottom-0 w-1 cursor-col-resize hover:bg-primary/50 transition-colors"></div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="ml-64 mt-14 p-6 min-h-screen">
        <div id="empty-state" class="flex flex-col items-center justify-center gap-5 min-h-[70vh] select-none">
            <svg width="72" height="72" viewBox="0 0 20 20" fill="none" class="text-on-surface-variant/25">
                <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="0.8"/>
                <path d="M10 0v4.5M10 15.5V20M0 10h4.5M15.5 10H20" stroke="currentColor" stroke-width="0.8"/>
                <circle cx="10" cy="10" r="1.25" fill="currentColor"/>
            </svg>
            <div class="text-center">
                <h1 class="text-lg font-semibold tracking-[0.02em] text-on-surface" style="text-wrap: balance">Shader autopsy for Minecraft jar</h1>
                <p class="mt-1.5 text-control font-mono text-on-surface-variant/70 tracking-wide">두 가지 버전을 선택 후 'COMPARE' 를 클릭하세요.</p>
            </div>
        </div>
        <div id="diff-list" class="flex flex-col gap-5"></div>
    </main>

    <script type="module" src="main.ts"></script>
</body>
</html>
